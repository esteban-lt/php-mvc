services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: php_mvc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d php_mvc"]
      interval: 10s
      retries: 5

volumes:
  postgres-data:
    driver: local
